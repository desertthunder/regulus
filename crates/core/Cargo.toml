[package]
name = "compiler_core"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
flate2 = "1.1.5"
prost = "0.14.1"
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
tar = "0.4.44"
toml = "1.1.2"
tree-sitter = "0.26.9"
tree-sitter-gleam = "1.0.0"
wat = "1.251.0"
x509-parser = "0.18.0"

[dev-dependencies]
insta = "1.43.2"
tempfile = "3.27.0"
wasmtime = "45.0.0"

[lints]
workspace = true
